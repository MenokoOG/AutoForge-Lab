[project]
name = "autoforge-lab-backend"
version = "0.1.0"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy",
  "psycopg[binary]",
  "pydantic",
  "pydantic-settings",
  "apscheduler",
  "httpx",
  "beautifulsoup4",
  "lxml",
  "pandas",
]

[project.optional-dependencies]
browser = [
  "playwright",
  "selenium",
]

dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# B008 is the FastAPI Depends() idiom. E501: long lines are left to the formatter.
ignore = ["B008", "E501"]
